set_turbo:
  name: Turbo Isıtma Başlat
  description: Belirtilen dakika boyunca kombiyi tam kapasite ısıtmaya alır, süre bitince otomatik eski moduna döner.
  fields:
    duration:
      name: Süre (Dakika)
      description: Turbo ısıtmanın çalışacağı süre (varsayılan 20 dakika).
      required: false
      default: 20
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: min

set_ventilation:
  name: Havalandırma (Kapalı) Başlat
  description: Belirtilen dakika boyunca ısıtmayı durdurur (kombiyi kapatır), süre bitince otomatik eski moduna döner.
  fields:
    duration:
      name: Süre (Dakika)
      description: Isıtmanın kapalı kalacağı süre (varsayılan 15 dakika).
      required: false
      default: 15
      selector:
        number:
          min: 5
          max: 180
          step: 5
          unit_of_measurement: min

cancel_timer:
  name: Süreli Modu İptal Et
  description: Aktif olan Turbo veya Havalandırma modunu derhal sonlandırarak sistemi önceki normal çalışma moduna döndürür.

set_combi_range:
  name: Kombi Çalışma ve Durma Aralığını Ayarla
  description: Kombinin hedef sıcaklığa göre devreye girme (çalışma) ve devreden çıkma (durma) tolerans aralıklarını (histerezis) belirler.
  fields:
    work_range:
      name: Çalışma Aralığı (°C)
      description: Hedef sıcaklığın kaç derece altına inildiğinde kombinin devreye gireceği (varsayılan 0.1°C).
      required: false
      default: 0.1
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"
    stop_range:
      name: Durma Aralığı (°C)
      description: Hedef sıcaklığın kaç derece üstüne çıkıldığında kombinin devreden çıkacağı (varsayılan 0.2°C).
      required: false
      default: 0.2
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"

set_schedule:
  name: Haftalık Program (Takvim) Moduna Geç
  description: Cosa termostatı haftalık program/takvim moduna geçirir.

set_auto:
  name: Otomatik Moda Geç
  description: Cosa termostatı otomatik plana geçirir.
